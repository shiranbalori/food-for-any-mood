<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#863bff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Any Mood" />
    <title>FOOD FOR ANY MOOD</title>
    <script>
      ;(function () {
        try {
          if ('scrollRestoration' in window.history) {
            window.history.scrollRestoration = 'manual'
          }
          window.scrollTo(0, 0)
          document.documentElement.scrollTop = 0
          document.body.scrollTop = 0
        } catch (e) {}
      })()
    </script>
    <script>
      ;(function () {
        try {
          var lang = localStorage.getItem('food-for-any-mood-lang')
          if (lang === 'en') {
            document.documentElement.lang = 'en'
            document.documentElement.dir = 'ltr'
          }
        } catch (e) {}
      })()
    </script>
    <script>
      ;(function () {
        window.__FOOD_MOOD_PWA__ = window.__FOOD_MOOD_PWA__ || { deferredPrompt: null }
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault()
          window.__FOOD_MOOD_PWA__.deferredPrompt = e
          console.log('[PWA] beforeinstallprompt captured (inline)')
          window.dispatchEvent(new Event('food-mood-pwa:install-prompt-ready'))
        })
        window.addEventListener('appinstalled', function () {
          window.__FOOD_MOOD_PWA__.deferredPrompt = null
          console.log('[PWA] appinstalled (inline)')
          window.dispatchEvent(new Event('food-mood-pwa:app-installed'))
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
